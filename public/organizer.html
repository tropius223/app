<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Flyerオーガナイザーページ </title>
    <link rel="stylesheet" href="style.css">
    <link rel="canonical" href="https://hot-flyer.com/organizer.html">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>(<span id="organizerName"></span>)</h1>
            <a href="#" id="logoutButton" class="secondary">
                <img src="https://img.icons8.com/?size=100&id=XWfIX8KKOkup&format=png&color=000000" alt="ログアウト" style="width: 24px; height: 24px;">
            </a>
        </div>

        <div id="message" class="message hidden"></div>

        <section id="addEventFormContainer">
            <details>
                <summary>＋ 新規イベントを追加</summary>
                <form id="addEventForm">
                    <div>
                        <label for="eventName">イベント名:</label>
                        <input type="text" id="eventName" name="event_name" required>
                    </div>
                    <div>
                        <label for="eventDate">開催日時:</label>
                        <input type="datetime-local" id="eventDate" name="date" required>
                    </div>
                     <div>
                        <label for="eventFlyer">フライヤー画像:</label>
                        <input type="file" id="eventFlyer" name="flyerImageFile" accept="image/*" required>
                    </div>
                    <div>
                        <label for="eventPrice">通常価格 (円):</label>
                        <input type="number" id="eventPrice" name="price" step="1" min="0" required>
                    </div>
                    <hr style="margin: 15px 0;">
                    <p style="font-weight: bold; margin-bottom: 10px;">特典設定</p>
                    <div>
                        <label for="rewardType">特典の種類:</label>
                        <select id="rewardType" name="reward_type" required>
                            <option value="discount">割引</option>
                            <option value="goods">グッズ</option>
                            <option value="drink">ドリンク</option>
                        </select>
                    </div>
                    <div id="rewardValueContainer">
                        <label for="rewardValue" id="rewardValueLabel">特典の内容:</label>
                        <input type="text" id="rewardValue" name="reward_value" required>
                    </div>
                    <div>
                        <label for="clicksForReward">特典獲得に必要なクリック数:</label>
                        <input type="number" id="clicksForReward" name="clicks_for_reward" min="1" step="1" required>
                    </div>
                    <div>
                        <label for="maxRewards">ユーザー1人あたりの最大特典数:</label>
                        <input type="number" id="maxRewards" name="max_rewards" min="1" step="1" required>
                    </div>
                    <hr style="margin: 15px 0;">
                    <div>
                        <label for="eventExpirate">クリック有効期限:</label>
                        <input type="datetime-local" id="eventExpirate" name="expirate" required>
                    </div>
                    <button type="submit">イベントを追加</button>
                </form>
            </details>
        </section>

        <section>
            <h2>登録済みイベント一覧</h2>
            <table id="organizerEventTable">
                <thead>
                    <tr>
                        <th>イベント名</th>
                        <th>開催日時</th>
                        <th>価格</th>
                        <th>特典</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="organizerEventTableBody">
                    <tr><td colspan="5">イベント情報を読み込み中...</td></tr>
                </tbody>
            </table>
        </section>

        <section style="margin-top: 30px;">
            <h2>特典状況サマリー</h2>
             <!-- ★★★ 絞り込みとダウンロードのセクション ★★★ -->
             <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                 <label for="filterEvent">イベントで絞り込み:</label>
                 <select id="filterEvent">
                     <option value="">すべてのイベント</option>
                 </select>
                 <button id="openSheetButton" disabled>スプレッドシートで開く</button>
             </div>
             <div id="rewardSummaryList" class="summary-list-container">
                <p>特典状況を読み込み中...</p>
            </div>
        </section>

    </div>

    <script src="organizer.js"></script>
</body>
</html>
